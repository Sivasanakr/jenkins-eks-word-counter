
apiVersion: apps/v1
kind: Deployment

metadata:
  name: word-counter
  namespace: devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: word-counter

  template:
    metadata:
      labels:
        app: word-counter

    spec:
      containers:
        - name: word-counter

          image: IMAGE_PLACEHOLDER

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
